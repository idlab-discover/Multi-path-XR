[workspace]
members = ["Agent", "Controller", "Server", "Client/receiver", "Proxy/CDN", "Libraries/Metrics", "Libraries/abr_core", "Libraries/pcf", "Libraries/shared_networking", "Libraries/shared_utils", "Libraries/dash_player", "Libraries/mp4_box", "Environments/VirtualWall", "Environments/BigVirtualWall", "Environments/VirtualWallLite"]
exclude = ["target"]
resolver = "2"

[profile.dev]
opt-level = 1
lto = "thin"
[profile.dev.package."*"]
opt-level = 1

[profile.no-opt]
inherits = "dev"
opt-level = 0
lto = false
[profile.no-opt.package."*"]
opt-level = 0

[workspace.dependencies]
spatial_utils = "0.1.0"
spatial_codecs = "0.2.4"
async-trait = "0.1"
byteorder = "1.5"
futures = "0.3"
tokio = { version = "1.42", features = ["full", "tracing"]}
tokio-util = "0.7"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
socketioxide = { version = "0.17.2", features = ["state"]  }
rust_socketio = { git = "https://github.com/mcabla/rust-socketio", branch="main", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34+deprecated"
tower = { version = "0.5.1", default-features = false }
tower-http = "0.6.2"
tracing = { version = "0.1", features = ["attributes"]}
tracing-subscriber = "0.3"
tracing-tracy = "0.11"
console-subscriber = "0.4.1"
socket2 = { version = "0.6", features = ["all"]}
axum = { version = "0.7", features = ["macros"]}
hyper-util = "0.1.10"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.7.0"
rayon = "1.10.0"
circular-buffer = "1.1.0"
metrics = { path = "./Libraries/Metrics" }
abr_core = { path = "./Libraries/abr_core" }
tmf = "0.2.1"
pcf = { path = "./Libraries/pcf" }
shared_networking = { path = "./Libraries/shared_networking" }
shared_utils = { path = "./Libraries/shared_utils" }
dash_player = { path = "./Libraries/dash_player" }
virtual-wall = { path = "./Environments/VirtualWall" }
virtual-wall-lite = { path = "./Environments/VirtualWallLite" }
big-virtual-wall = { path = "./Environments/BigVirtualWall" }
mp4_box = { path = "./Libraries/mp4_box" }
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
sysinfo = "0.36.1"
regex = "1.11.1"
once_cell = "1.20.2"
webrtc = "0.17"
rand = "0.9.2"
rand_chacha = "0.9.0"
half = "2.7.1"
nalgebra = "0.34.0"
glam = "0.30.5"
flute = "1.10.6"
uuid = "1.11.0"
url = "2"
prometheus = "0.14.0"
sha2 = "0.10.8"
dashmap = "6.1.0"
bitcode = "0.6.3"
bytes = "1.11"
rbase64 = "2.0.3"
bitvec = "1.0.1"
chrono = "0.4.40"
quick-xml = "0.38.1"
libc = "0.2"
memmap2 = "0.9"
signal-hook = "0.3.18"
toml = "0.9.8"
kiddo = "5.2.2"
indicatif = "0.18.1"
flate2 = { version = "1.1.5", default-features = false , features = ["zlib-rs"] }
zstd = { version = "0.13.3", default-features = true }
lz4_flex = "0.11"
snap = "1.1"
bitflags = "2"
rust-openzl = "0.1.0"
rustls = { version = "0.23.31", default-features = false, features = ["aws-lc-rs", "ring"] }
interoptopus = "0.14.27"
interoptopus_backend_csharp = "0.14.25"
