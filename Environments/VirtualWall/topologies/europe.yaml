    impairment:
      - { latency_ms: 0, packet_loss: 0.0, capacity_kbit_per_s: 1000000 }

############################################################
# ROLES (Selective fabric attachment)
############################################################

roles:

  - name: "server"
    fabrics: ["A", "B"]

  - name: "core_A"
    fabrics: ["A", "B", "C_A", "D_A"]

  - name: "core_B"
    fabrics: ["A", "B", "C_B", "D_B"]

  - name: "core_C"
    fabrics: ["A", "B", "C_C", "D_C"]

  - name: "regional_A1"
    fabrics: ["C_A", "D_A", "E_A1", "F_A1"]

  - name: "regional_A2"
    fabrics: ["C_A", "D_A", "E_A2", "F_A2"]

  - name: "regional_B1"
    fabrics: ["C_B", "D_B", "E_B1", "F_B1"]

  - name: "regional_B2"
    fabrics: ["C_B", "D_B", "E_B2", "F_B2"]

  - name: "regional_C1"
    fabrics: ["C_C", "D_C", "E_C1", "F_C1"]

  - name: "regional_C2"
    fabrics: ["C_C", "D_C", "E_C2", "F_C2"]

  - name: "edge_A1"
    fabrics: ["E_A1", "F_A1"]

  - name: "edge_A2"
    fabrics: ["E_A2", "F_A2"]

  - name: "edge_B1"
    fabrics: ["E_B1", "F_B1"]

  - name: "edge_B2"
    fabrics: ["E_B2", "F_B2"]

  - name: "edge_C1"
    fabrics: ["E_C1", "F_C1"]

  - name: "edge_C2"
    fabrics: ["E_C2", "F_C2"]

############################################################
# NODES (22 total)
############################################################

nodes:

  # Origin
  - name: "origin1"
    role: "server"

  # Cores
  - name: "coreA"
    role: "core_A"
  - name: "coreB"
    role: "core_B"
  - name: "coreC"
    role: "core_C"

  # Regionals
  - name: "regionalA1"
    role: "regional_A1"
  - name: "regionalA2"
    role: "regional_A2"
  - name: "regionalB1"
    role: "regional_B1"
  - name: "regionalB2"
    role: "regional_B2"
  - name: "regionalC1"
    role: "regional_C1"
  - name: "regionalC2"
    role: "regional_C2"

  # Edges (also run receivers)
  - name: "edgeA1"
    role: "edge_A1"
  - name: "edgeA2"
    role: "edge_A2"
  - name: "edgeB1"
    role: "edge_B1"
  - name: "edgeB2"
    role: "edge_B2"
  - name: "edgeC1"
    role: "edge_C1"
  - name: "edgeC2"
    role: "edge_C2"
