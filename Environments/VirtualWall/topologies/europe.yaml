    network_id: "D_B"
    ipv4_subnet: "192.168.23.0/24"
    host_start: 10
    impairment:
      - { latency_ms: 0, packet_loss: 0.0, capacity_kbit_per_s: 1000000 }

  - name: "C_C"
    order: 14
    network_id: "C_C"
    ipv4_subnet: "192.168.24.0/24"
    host_start: 10
    impairment:
      - { latency_ms: 0, packet_loss: 0.0, capacity_kbit_per_s: 1000000 }

