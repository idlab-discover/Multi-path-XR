port_id_scheme: { prefix: "if", start_index: 0 }
max_experiment_nics_per_node: 4   # CTRL is implicit, so 4 experiment NICs max
resource_prefix: "vw-"

############################################################
# FABRICS (VLAN-backed, disjoint L2 domains)
############################################################

fabrics:

  ##########################################################
  # SERVER ↔ CORES (WAN multipath)
  ##########################################################

  - name: "A"
    order: 1
    network_id: "A"
    ipv4_subnet: "192.168.10.0/24"
    host_start: 10
    impairment:
      - { latency_ms: 0, packet_loss: 0.0, capacity_kbit_per_s: 1000000 }

  - name: "B"
    order: 2
    network_id: "B"
    ipv4_subnet: "192.168.11.0/24"
    host_start: 10
    impairment:
      - { latency_ms: 0, packet_loss: 0.0, capacity_kbit_per_s: 1000000 }

  ##########################################################
  # CORE ↔ REGIONAL (per-core unicast + multicast)
  ##########################################################

  - name: "C_A"
    order: 10
    network_id: "C_A"
    ipv4_subnet: "192.168.20.0/24"
    host_start: 10
    impairment:
